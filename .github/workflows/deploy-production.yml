name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://api.a97homes.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: sudo -n /var/www/deploy/deploy-production.sh origin/main

      - name: Public health check
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            https://api.a97homes.com/api/V1/countries)
          echo "production health -> HTTP $code"
          test "$code" = "200"
