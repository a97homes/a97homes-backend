name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release timestamp to roll back to (blank = previous release)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://api.a97homes.com

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 8m
          script_stop: true
          script: sudo -n /var/www/deploy/rollback-production.sh ${{ inputs.release }}

      - name: Public health check
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            https://api.a97homes.com/api/V1/countries)
          echo "production health -> HTTP $code"
          test "$code" = "200"
