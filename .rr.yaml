version: '3'
rpc:
    listen: 'tcp://0.0.0.0:6043'
server:
    command: 'php app.php'
    relay: pipes
http:
    address: 'a97infinity.test:8443'
    middleware:
        - gzip
        - static
    static:
        dir: public
        forbid:
            - .php
            - .htaccess
    pool:
        num_workers: 1
        supervisor:
            max_worker_memory: 100
    ssl:
        cert: C:\laragon\etc\ssl\laragon.crt
        key: C:\laragon\etc\ssl\laragon.key
jobs:
    pool:
        num_workers: 2
        max_worker_memory: 100
    consume: {}
kv:
    local:
        driver: memory
        config:
            interval: 60
metrics:
    address: '0.0.0.0:2143'